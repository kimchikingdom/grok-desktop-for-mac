appId: io.github.kimchikingdom.grokdesktop
productName: Grok Desktop
copyright: Grok Desktop contributors
directories:
  output: release
  buildResources: build
afterSign: build/after-pack.cjs
files:
  - out/**/*
  - package.json
# Everything is bundled into out/, so no node_modules are shipped.
asar: true
# Electron ships these switches on by default, which turns a signed app into a
# general-purpose script runner: ELECTRON_RUN_AS_NODE=1 "Grok Desktop" -e '…'
# executes arbitrary code under this app's identity and its granted TCC
# permissions. Nothing here needs them.
# enableEmbeddedAsarIntegrityValidation and onlyLoadAppFromAsar belong here too,
# but on macOS they need a real signature to validate against: an unsigned build
# with them on exits silently at startup. They go on together with the signing
# identity — see RELEASE_CHECKLIST.md.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  # Signing identity and notarisation credentials are supplied by CI, never
  # committed. Without them the build produces an unsigned local artefact.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null
